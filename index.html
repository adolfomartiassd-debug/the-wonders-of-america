<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Part II: Hispaniola, destination of the voyage that changed the history of humanity. A comic by Iván Gatón.">
<meta property="og:title" content="The Wonders of the First Adventures in America">
<meta property="og:description" content="Part II: Hispaniola. A comic by Iván Gatón. Read all 36 pages online or download the PDF.">
<meta property="og:image" content="cover.jpg">
<link rel="icon" href="cover.jpg">
<title>The Wonders of the First Adventures in America</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bangers&family=Poppins:wght@500;700&display=swap">
<style>
/* Layout: comic-book reader. Halftone teal ground, one column of pages, sticky ink bar with the download. */
:root{
  --teal:#3CAAAF; --teal-d:#2C8C92; --yellow:#F6EB15; --red:#C3193C; --ink:#141418; --paper:#FFFFFF;
  --display:"Bangers","Impact","Arial Narrow Bold",sans-serif;
  --body:"Poppins","Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
html{background:var(--teal)}
body{
  background:var(--teal);
  background-image:radial-gradient(var(--teal-d) 22%,transparent 24%);
  background-size:22px 22px;
  color:var(--ink); font-family:var(--body);
  padding-inline:16px; padding-block:0 48px;
}
.bar{
  position:sticky; top:env(safe-area-inset-top,0px); z-index:5;
  margin-inline:-16px; padding:10px 16px;
  background:var(--ink); color:var(--paper);
  display:flex; align-items:center; justify-content:space-between; gap:12px;
}
.bar small{font-size:13px; letter-spacing:.08em; text-transform:uppercase; opacity:.85}
.count{font-variant-numeric:tabular-nums}
.btn{text-decoration:none;display:inline-block;
  font:700 15px/1 var(--body); color:var(--ink); background:var(--yellow);
  border:3px solid var(--ink); box-shadow:4px 4px 0 var(--red);
  padding:11px 16px; cursor:pointer; white-space:nowrap;
}
.btn:active{transform:translate(2px,2px); box-shadow:2px 2px 0 var(--red)}
.btn:focus-visible{outline:3px solid var(--paper); outline-offset:3px}
.btn[disabled]{opacity:.6; cursor:wait}
header{max-width:760px; margin:28px auto 22px; text-align:center}
.kicker{display:inline-block; background:var(--red); color:var(--paper); border:3px solid var(--ink);
  font-weight:700; font-size:13px; letter-spacing:.1em; text-transform:uppercase; padding:6px 12px}
h1{
  font-family:var(--display); font-weight:400; color:var(--yellow);
  font-size:clamp(40px,9vw,76px); line-height:.95; letter-spacing:.02em; margin:14px 0 10px;
  -webkit-text-stroke:2px var(--ink); text-shadow:4px 4px 0 var(--ink); text-wrap:balance;
}
.by{display:inline-block; background:var(--paper); border:3px solid var(--ink); padding:6px 14px; font-weight:700}
.sub{max-width:60ch; margin:14px auto 0; font-size:15px; line-height:1.55; color:var(--ink)}
.status{min-height:1.4em; margin-top:10px; font-size:14px; font-weight:500}
main{max-width:760px; margin:0 auto; display:grid; gap:22px}
figure{margin:0; background:var(--paper); border:4px solid var(--ink); box-shadow:8px 8px 0 var(--ink); position:relative}
figure img{display:block; width:100%; height:auto; aspect-ratio:963/1238; background:var(--paper)}
figcaption{position:absolute; right:-4px; bottom:-4px; background:var(--ink); color:var(--paper);
  font-size:12px; font-weight:700; padding:4px 9px; font-variant-numeric:tabular-nums}
footer{max-width:760px; margin:34px auto 0; text-align:center; display:grid; gap:12px; justify-items:center}
@media (max-width:480px){ .bar small{display:none} figure{box-shadow:5px 5px 0 var(--ink)} }
@media (prefers-reduced-motion:reduce){ *{transition:none!important} }
</style>
</head>
<body>


<div class="bar">
  <small>Part II · Hispaniola</small>
  <span class="count" id="count">Page 1 / 36</span>
  <a class="btn" href="The-Wonders-of-the-First-Adventures-in-America-Part-II.pdf" target="_blank" rel="noopener">Open PDF</a>
</div>

<header>
  <span class="kicker">Part II · Hispaniola</span>
  <h1>The Wonders of the First Adventures in America</h1>
  <span class="by">by Iván Gatón</span>
  <p class="sub">Hispaniola, destination of the voyage that changed the history of humanity. Scroll to read all 36 pages, or download the PDF.</p>
  
</header>

<main id="pages"></main>

<footer>
  <a class="btn" href="The-Wonders-of-the-First-Adventures-in-America-Part-II.pdf" target="_blank" rel="noopener">Open PDF</a>
</footer>


<script>
const N=36,wrap=document.getElementById('pages');
for(let i=1;i<=N;i++){const n=String(i).padStart(2,'0');const f=document.createElement('figure');f.dataset.page=i;
f.innerHTML=`<img src="pages/p-${n}.jpg" width="963" height="1238" alt="Comic page ${i}" ${i>2?'loading="lazy"':''} decoding="async"><figcaption>${i}</figcaption>`;wrap.appendChild(f);}
const count=document.getElementById('count');
const io=new IntersectionObserver(es=>{es.forEach(e=>{if(e.isIntersecting)count.textContent=`Page ${e.target.dataset.page} / ${N}`;});},{rootMargin:'-45% 0px -50% 0px'});
document.querySelectorAll('figure').forEach(f=>io.observe(f));
</script>
</body>
</html>
